<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Joule</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: pan-y;
}
.contact {
  position: fixed;
  bottom: 12%;
  width: 100%;
  text-align: center;
  color: #aeb2ba;
  font-size: 15px;
  letter-spacing: -.025em;
  pointer-events: none;
}
.contact a {
  color: #f0f1f3;
  text-decoration: none;
  border-bottom: 1px solid #777;
  padding-bottom: 3px;
  pointer-events: auto;
}
@media(max-width:600px) {
  .contact { font-size: 12px; }
}
</style>
</head>
<body>
<canvas id="dust"></canvas>
<div class="contact">
  Get in touch at
  <a href="mailto:admin@joule.inc">admin@joule.inc</a>
</div>
<script>
const canvas = document.getElementById("dust");
const ctx = canvas.getContext("2d");
const TAU = Math.PI * 2;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, pulses = [];
let pointer = {x:0,y:0,on:false,power:0};

function resize() {
  W = innerWidth;
  H = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
addEventListener("resize", resize);

const particles = Array.from({length:1400}, () => {
  const z = Math.random()*2-1;
  const a = Math.random()*TAU;
  const r = Math.cbrt(Math.random());
  const radial = r*Math.sqrt(1-z*z);
  return {
    x: radial*Math.cos(a),
    y: r*z,
    z: radial*Math.sin(a),
    phase: Math.random()*TAU,
    size: .4+Math.random()*1.2,
    brightness: Math.random()
  };
});

function move(e) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = e.clientX-rect.left;
  pointer.y = e.clientY-rect.top;
  pointer.on = true;
  if (reduce) draw(0);
}
canvas.addEventListener("pointermove", move);
canvas.addEventListener("pointerleave", () => pointer.on=false);
canvas.addEventListener("pointerdown", e => {
  move(e);
  pulses.push({x:pointer.x,y:pointer.y,t:performance.now()/1000});
  if(pulses.length>5) pulses.shift();
});
canvas.addEventListener("pointerup", e => {
  if(e.pointerType!=="mouse") pointer.on=false;
});

function draw(ms) {
  const t = reduce ? 0 : ms/1000;
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,W,H);

  pointer.power += ((pointer.on?1:0)-pointer.power)*.06;

  const R = Math.min(W*.33,H*.39,200);
  const cx=W*.5, cy=H*.43;
  const yaw=t*.115, ca=Math.cos(yaw), sa=Math.sin(yaw);
  const pitch=Math.sin(t*.19)*.15;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  const breath=1+.025*Math.sin(t*.65);

  const halo=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.5);
  halo.addColorStop(0,"rgba(110,145,180,.035)");
  halo.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=halo;
  ctx.fillRect(cx-R*1.5,cy-R*1.5,R*3,R*3);

  ctx.globalCompositeOperation="screen";

  const count = W<500 ? 1000 : particles.length;
  for(let i=0;i<count;i++) {
    const p=particles[i];
    let x=p.x*ca+p.z*sa;
    let z=-p.x*sa+p.z*ca;
    let y=p.y*cp-z*sp;
    z=p.y*sp+z*cp;

    const flow=.035*Math.sin(y*5+t*.4+p.phase);
    let px=cx+(x+flow)*R*1.25*breath;
    let py=cy+y*R*.84*breath;

    const dx=pointer.x-px, dy=pointer.y-py;
    const dist=Math.hypot(dx,dy)+.001;
    const attraction=pointer.power*.24*
      Math.exp(-Math.pow(dist/135,2));
    px+=dx*attraction-dy*attraction*.20;
    py+=dy*attraction+dx*attraction*.20;

    for(const pulse of pulses) {
      const age=t-pulse.t;
      if(age<0||age>2.2) continue;
      const vx=px-pulse.x,vy=py-pulse.y;
      const d=Math.hypot(vx,vy)+.001;
      const kick=24*Math.exp(-Math.pow((d-age*185)/34,2))
        *Math.exp(-age*.8);
      px+=vx/d*kick;
      py+=vy/d*kick;
    }

    const depth=(z+1)/2;
    const alpha=(.17+.66*depth)*(.7+.3*p.brightness);
    const size=p.size*(.7+.45*depth);

    ctx.fillStyle=`rgba(224,235,247,${alpha})`;
    ctx.beginPath();
    ctx.arc(px,py,size,0,TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation="source-over";
  pulses=pulses.filter(p=>t-p.t<2.2);
  if(!reduce) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
