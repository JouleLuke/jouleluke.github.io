<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Joule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  background: #000000;
}
a { color: #A9B0BA; }
a:hover { color: #FFFFFF; }
a:focus-visible { outline: 1px solid #F3F5F8; outline-offset: 6px; }

main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  box-sizing: border-box;
  padding: 40px clamp(20px, 4vw, 56px);
  background: #000000;
  color: #F3F5F8;
  font-family: 'Inter Tight', Arial, Helvetica, sans-serif;
}
.row {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px 28px;
}
h1 {
  /* negative right margin cancels the trailing letter-spacing */
  margin: 0 -0.36em 0 0;
  font-size: 52px;
  font-weight: 500;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  line-height: 1.2;
}
.beam {
  position: relative;
  flex: 1 1 360px;
  min-width: 0;
  height: clamp(200px, 40vh, 400px);
}
.beam canvas {
  position: absolute;
  top: 0;
  left: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: pan-y;
}
.contact {
  display: inline-block;
  font-size: 16px;
  line-height: 44px;
  letter-spacing: 0.02em;
  text-decoration: none;
}

/* Phones: stack centered, and let the beam run edge to edge as a horizon
   between the wordmark and the contact link. */
@media (max-width: 640px) {
  main { --pad: 20px; padding: 40px var(--pad); }
  .row {
    flex-direction: column;
    flex-wrap: nowrap;
    gap: 0;
  }
  h1 { font-size: clamp(40px, 13vw, 52px); }
  .beam {
    flex: none;
    align-self: stretch;
    margin: 0 calc(-1 * var(--pad));
    height: 150px;
  }
}
</style>
</head>
<body>
<main>
  <div class="row">
    <h1>Joule</h1>
    <div class="beam"><canvas id="beam" aria-hidden="true"></canvas></div>
    <a class="contact" href="mailto:contact@joule.inc">contact@joule.inc</a>
  </div>
</main>
<script>
(() => {
  const TINT = "214,221,231"; // #D6DDE7
  const canvas = document.getElementById("beam");
  const ctx = canvas.getContext("2d");
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const pointer = { x: 0, y: 0, on: false, power: 0 };
  let W = 0, H = 0, N = 0, y, v, acc, grads, gradW = -1;
  let last = null, idle = 0, nextIdle = 1.2, flip = 1;

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = w;
    H = h;
    const n = Math.max(60, Math.min(420, Math.round(w / 4)));
    if (!y || y.length !== n) {
      y = new Float32Array(n);
      v = new Float32Array(n);
      acc = new Float32Array(n);
    }
    N = n;
  }

  function move(e) {
    if (!W) return;
    const r = canvas.getBoundingClientRect();
    pointer.x = (e.clientX - r.left) * (r.width ? W / r.width : 1);
    pointer.y = (e.clientY - r.top) * (r.height ? H / r.height : 1);
    pointer.on = true;
    if (reduce) draw(0);
  }

  // Give the string a velocity kick around u (0..1) with a Gaussian of `width` px.
  function pluck(u, amp, width) {
    for (let i = 1; i < N - 1; i++) {
      const d = ((i / (N - 1)) - u) * W / width;
      v[i] += amp * Math.exp(-d * d);
    }
  }

  // A damped wave equation; the pointer drags the string while it is near.
  function step() {
    const cy = H / 2, c2 = 0.22, damp = 0.006;
    for (let s = 0; s < 4; s++) {
      for (let i = 1; i < N - 1; i++) {
        let a = c2 * (y[i - 1] - 2 * y[i] + y[i + 1]) - damp * v[i] - 0.0004 * y[i];
        if (pointer.power > 0.002) {
          const dx = ((i / (N - 1)) * W - pointer.x) / 70;
          const dist = pointer.y - (cy + y[i]);
          a += dist * 0.005 * pointer.power * Math.exp(-dx * dx) * Math.exp(-(dist * dist) / 6400);
        }
        acc[i] = a;
      }
      for (let i = 1; i < N - 1; i++) {
        v[i] += acc[i];
        y[i] += v[i];
      }
    }
  }

  function gradient(alpha) {
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, "rgba(" + TINT + ",0)");
    g.addColorStop(0.05, "rgba(" + TINT + "," + alpha + ")");
    g.addColorStop(0.95, "rgba(" + TINT + "," + alpha + ")");
    g.addColorStop(1, "rgba(" + TINT + ",0)");
    return g;
  }

  function draw(ms) {
    if (!W || !N) return;
    const t = reduce ? 0 : ms / 1000;
    const dt = last == null ? 0.016 : Math.max(0, Math.min(0.05, t - last));
    last = t;
    pointer.power += ((pointer.on ? 1 : 0) - pointer.power) * 0.08;

    if (!reduce) {
      idle += dt;
      if (pointer.on) idle = 0;
      if (idle > nextIdle) {
        idle = 0;
        nextIdle = 4.5 + Math.random() * 3;
        flip = -flip;
        pluck(0.25 + Math.random() * 0.5, flip * 1.4, 60);
      }
      step();
    }

    if (gradW !== W) {
      grads = [gradient(0.05), gradient(0.16), gradient(0.95), gradient(0.07)];
      gradW = W;
    }

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, W, H);

    const cy = H / 2;
    ctx.strokeStyle = grads[3];
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, cy);
    ctx.lineTo(W, cy);
    ctx.stroke();

    const path = new Path2D();
    for (let i = 0; i < N; i++) {
      const u = i / (N - 1);
      const amb = reduce ? 0 : 0.6 * Math.sin(u * Math.PI) * Math.sin(i * 0.05 - t * 1.3);
      const yy = cy + y[i] + amb;
      if (i === 0) path.moveTo(0, yy);
      else path.lineTo(u * W, yy);
    }
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = grads[0];
    ctx.lineWidth = 10;
    ctx.stroke(path);
    ctx.strokeStyle = grads[1];
    ctx.lineWidth = 3.4;
    ctx.stroke(path);
    ctx.strokeStyle = grads[2];
    ctx.lineWidth = 1.1;
    ctx.stroke(path);
    ctx.globalCompositeOperation = "source-over";
  }

  canvas.addEventListener("pointermove", move);
  canvas.addEventListener("pointerdown", (e) => {
    move(e);
    if (reduce || !N) return;
    const i = Math.max(1, Math.min(N - 2, Math.round((pointer.x / W) * (N - 1))));
    const sign = pointer.y < H / 2 + y[i] ? -1 : 1;
    pluck(pointer.x / W, sign * 3, 36);
    idle = 0;
  });
  canvas.addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") pointer.on = false; });
  canvas.addEventListener("pointerleave", () => { pointer.on = false; });

  resize();
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(() => { resize(); if (reduce) draw(0); }).observe(canvas);
  } else {
    addEventListener("resize", () => { resize(); if (reduce) draw(0); });
  }

  const loop = (ms) => {
    draw(ms);
    if (!reduce) requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
